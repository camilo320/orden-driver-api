spring:
  application:
    name: orden-api
  datasource:
      url: jdbc:h2:mem:orden-db
      username: sa
      password: sa
      driverClassName: org.h2.Driver
  h2:
    console:
      enabled: true
  #Configuración JPA
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true